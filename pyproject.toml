[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe-memory"
version = "0.20.6"
description = "Agent-authored data graph and keyword-only embedding endpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vibe Memory contributors"}]
requires-python = ">=3.12,<3.14"
dependencies = [
  "anyio>=4,<5",
  "cryptography>=46,<47",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "kuzu==0.11.3",
  "psycopg[binary,pool]>=3.2,<4",
  "fastembed>=0.7,<0.9",
  "pydantic-settings>=2.7,<3",
  "segno>=1.6.6,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
vibe-memory = "vibe_memory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency defaults are intentional.

[project.urls]
Homepage = "https://vibememory.io"
Repository = "https://github.com/vibememory/vibememory"
Issues = "https://github.com/vibememory/vibememory/issues"

[tool.hatch.build.targets.wheel.force-include]
"landing/dist" = "vibe_memory/web"

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/landing/app", "/landing/components", "/landing/lib", "/landing/public",
  "/landing/templates", "/landing/dist", "/landing/src", "/landing/scripts/package_skill.py",
  "/landing/scripts/finalize_next_build.py", "/landing/next.config.ts",
  "/landing/next-env.d.ts", "/landing/tsconfig.json", "/landing/package.json",
  "/landing/package-lock.json", "/landing/wrangler.example.jsonc", "/landing/data",
  "/landing/brand-assets.json", "/skills", "/docs", "/tests", "/scripts", "/ops/*.py",
  "/agent-adapters", "/README.md", "/README.ko.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
  "/CONTRIBUTING.md", "/SECURITY.md", "/pyproject.toml", "/uv.lock",
  "/Dockerfile", "/compose*.yaml", "/.env.example", "/.dockerignore", "/deploy", "/.github"
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

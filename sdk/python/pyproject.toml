[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibememory-client"
version = "0.1.0"
description = "Dependency-free typed-ish client for the Vibe Memory REST API"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.hatch.build.targets.wheel]
packages = ["vibememory"]
